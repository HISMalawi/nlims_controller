# Every setting comes from the environment so the same image can be a local
# node or the national one with nothing but a different .env file.
default: &default
  adapter: mysql2
  encoding: utf8mb4
  collation: utf8mb4_unicode_ci
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("DATABASE_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DATABASE_PORT", 3306) %>
  username: <%= ENV.fetch("DATABASE_USER", "root") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "") %>
  variables:
    sql_mode: STRICT_ALL_TABLES
    # READ COMMITTED, not the MySQL default of REPEATABLE READ.
    #
    # The replication cursor is ordered by a row lock held until commit, which
    # works at any isolation level. Repeatable reads buy this application
    # nothing and cost it portability: MariaDB 11.6+ turns on
    # innodb_snapshot_isolation by default, and a locking read of a row that
    # moved since the snapshot then fails outright instead of reading the
    # current version the way MySQL does. Under READ COMMITTED both engines
    # behave the same, and a reader polling for changes wants the latest
    # committed rows anyway.
    transaction_isolation: READ-COMMITTED

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "sislab_sync_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "sislab_sync_test") %>

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "sislab_sync_production") %>
